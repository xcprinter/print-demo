<!DOCTYPE html>
<html>
<head>
  <title>XCPrinter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="card" data-controller="print-pos">
    <div class="text-centered">
      <h1 data-print="text_big" class="text-white">标题大文字</h1>
      <h2 data-print="text" class="text-white">普通文字</h2>
      <h2 data-print="qrcode" class="text-white">二维码</h2>
    </div>
    <button data-action="print-pos#print" class="button">打印</button>
  </section>
</body>
</html>
